# CD de festa-gateway (SCRUM-45).
# Construye la imagen y la publica en GitHub Container Registry (GHCR).
#
# Publica solo cuando corre por un push real a `main`. En un PR o al lanzarlo a mano
# (workflow_dispatch) solo construye la imagen, para validar el Dockerfile sin publicar nada.
# El despliegue real en AWS se agrega como un paso adicional cuando llegue el laboratorio
# de créditos (SCRUM-134), sin rehacer el build.
name: CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
    paths:
      - Dockerfile
      - kong.yml.tmpl
      - entrypoint.sh
      - .github/workflows/cd.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagen:
    name: Build y publicar imagen en GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: ¿Publicar esta ejecución?
        id: publicar
        run: echo "si=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}" >> "$GITHUB_OUTPUT"

      - name: Iniciar sesión en GHCR
        if: steps.publicar.outputs.si == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/desparcha2-swnt/festa-gateway
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ steps.publicar.outputs.si }}

      - name: Build (y publicar si corresponde)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ steps.publicar.outputs.si == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
